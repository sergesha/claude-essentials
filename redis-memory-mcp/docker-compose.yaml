# SECURITY: the published ports below bind to ALL host interfaces (Docker's
# default when no host IP is given), and this stack ships with NO Redis auth.
# On a host with a public IP — and note Docker's iptables rules typically
# bypass ufw — that is an open, unauthenticated database. Only run this on a
# trusted network / behind a firewall, or add authentication. This is NOT a
# secrets store: see the "Security" section of README.md before storing
# anything sensitive. Redis auth + per-NAMESPACE ACL isolation is tracked
# separately.
services:
  redis:
    image: redis/redis-stack-server:latest   # server-only: same RediSearch/HNSW modules, without the RedisInsight web GUI
    container_name: redis-stack
    platform: linux/amd64
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--save 900 1 --save 300 10 --appendonly yes --appendfsync everysec --maxmemory 2gb --maxmemory-policy volatile-lru
    volumes:
      - type: bind
        source: ./redis_data
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  embeddings:
    build:
      context: ./server
      target: embeddings
    container_name: embeddings-gemma
    ports:
      - "8082:80"
    volumes:
      - ./gemma_cache:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  redis-memory-mcp:
    build:
      context: ./server
      target: mcp
    image: redis-memory-mcp
    container_name: redis-memory-mcp
    depends_on:
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EMBED_URL=http://embeddings:80
      - INDEX_NAME=idx:memories
      - "CHUNK_MAX_TOKENS=${CHUNK_MAX_TOKENS:-256}"
      - "EMBED_DIMENSION=${EMBED_DIMENSION:-256}"
    stdin_open: true
    tty: false
    restart: unless-stopped
