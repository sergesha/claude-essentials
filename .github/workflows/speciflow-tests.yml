name: speciflow-tests

on:
  pull_request:
    paths:
      - "speciflow/**"
      - ".claude-plugin/marketplace.json"
      - ".codex-plugin/marketplace.json"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/speciflow-tests.yml"
  push:
    branches:
      - main
    paths:
      - "speciflow/**"
      - ".claude-plugin/marketplace.json"
      - ".codex-plugin/marketplace.json"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/speciflow-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: speciflow/uv.lock
      - name: Install dependencies
        run: uv sync --project speciflow --locked
      - name: Run SpeciFlow tests
        run: uv run --project speciflow --frozen pytest speciflow/tests -q
