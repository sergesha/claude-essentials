name: lockstep-tests

on:
  push:
    branches:
      - main
    paths:
      # every path the suite asserts on, not just the engine: tests pin the
      # shipped hooks.json matcher and compile the example recipes, so a PR
      # touching only those would go green without ever running the test
      # that guards them.
      - "lockstep/engine/**"
      - "lockstep/hooks/**"
      - "lockstep/recipes/**"
      - "lockstep/.claude-plugin/**"
      - ".github/workflows/lockstep-tests.yml"
  pull_request:
    paths:
      # every path the suite asserts on, not just the engine: tests pin the
      # shipped hooks.json matcher and compile the example recipes, so a PR
      # touching only those would go green without ever running the test
      # that guards them.
      - "lockstep/engine/**"
      - "lockstep/hooks/**"
      - "lockstep/recipes/**"
      - "lockstep/.claude-plugin/**"
      - ".github/workflows/lockstep-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: uv sync
        working-directory: lockstep/engine
        run: uv sync

      - name: mypy effect phase contract
        working-directory: lockstep/engine
        run: uv run mypy

      - name: pytest
        working-directory: lockstep/engine
        run: uv run pytest tests -v
