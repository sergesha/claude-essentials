name: redis-memory

on:
  pull_request:
    paths:
      - "redis-memory-mcp/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/redis-memory.yml"
  push:
    branches: [main]
    paths:
      - "redis-memory-mcp/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/redis-memory.yml"

permissions:
  contents: read

jobs:
  mcp-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'mcp>=2.0.0,<3'
      - run: docker build -t redis-memory-smoke redis-memory-mcp/server
      - run: python redis-memory-mcp/tests/smoke_mcp.py redis-memory-smoke

  native-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build native wheel
        run: >-
          python -m pip wheel --no-deps
          --wheel-dir "${{ runner.temp }}/redis-memory-dist"
          redis-memory-mcp/server
      - name: Install wheel in a clean environment
        run: |
          python -m venv "${{ runner.temp }}/redis-memory-venv"
          "${{ runner.temp }}/redis-memory-venv/bin/python" -m pip install \
            "${{ runner.temp }}"/redis-memory-dist/redis_memory_mcp-*.whl
      - name: Smoke installed native MCP server
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          "${{ runner.temp }}/redis-memory-venv/bin/python" \
            redis-memory-mcp/tests/native_smoke.py \
            "${{ runner.temp }}"/redis-memory-dist/redis_memory_mcp-*.whl \
            "${{ runner.temp }}/redis-memory-venv/bin/redis-memory-mcp" \
            --redis-kv
