name: knowledge-atlas

on:
  pull_request:
    paths:
      - "knowledge-atlas/**"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/knowledge-atlas.yml"
      - ".github/workflows/release-please.yml"
      - ".github/actions/plugin-image-security/**"
      - "tools/image_security/**"
  push:
    branches: [main]
    paths:
      - "knowledge-atlas/**"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/workflows/knowledge-atlas.yml"
      - ".github/workflows/release-please.yml"
      - ".github/actions/plugin-image-security/**"
      - "tools/image_security/**"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locked Python dependencies
        working-directory: knowledge-atlas
        run: uv sync --locked
      - name: Package regression tests
        working-directory: knowledge-atlas
        run: uv run --no-sync pytest -q
      - name: Viewer regression tests
        working-directory: knowledge-atlas
        run: node --test tests/viewer_*.test.mjs
      - name: Build distribution
        working-directory: knowledge-atlas
        run: uv build
      - name: Claude plugin validation
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate knowledge-atlas

  native-extractor:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: knowledge-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the qualified Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build pinned Utopia wrapper
        run: cargo +1.99.1 build --locked --manifest-path native/extract/Cargo.toml
      - name: Exercise native extraction, update and type decisions
        run: |
          export POC9_EXTRACT_BIN="$PWD/native/extract/target/debug/poc9-extract"
          test -x "$POC9_EXTRACT_BIN"
          uv sync --locked
          uv run --no-sync pytest -q tests/test_retained_ingest.py tests/test_type_decisions.py

  atlas-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pull request candidate
        id: build
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("knowledge-atlas/pyproject.toml", "rb"))["project"]["version"])')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          df -h "$RUNNER_TEMP"
          free -h
          docker buildx build --load --platform linux/arm64 --tag atlas-pr-candidate:local \
            --build-arg ATLAS_VERSION="$version" \
            --build-arg ATLAS_REVISION="$GITHUB_SHA" -f knowledge-atlas/docker/Dockerfile knowledge-atlas
          printf 'image=%s\nversion=%s\n' \
            "$(docker image inspect --format '{{.Id}}' atlas-pr-candidate:local)" "$version" >> "$GITHUB_OUTPUT"
      - name: Exercise the packaged Atlas application
        env:
          IMAGE_ID: ${{ steps.build.outputs.image }}
          ATLAS_VERSION: ${{ steps.build.outputs.version }}
        run: |
          python3 knowledge-atlas/scripts/verify-release-image.py --local-id "$IMAGE_ID" \
            --version "$ATLAS_VERSION" --revision "$GITHUB_SHA"
      - uses: ./.github/actions/plugin-image-security
        with:
          producer: knowledge-atlas
          image: ${{ steps.build.outputs.image }}
          platform: linux/arm64
          out: ${{ runner.temp }}/atlas-security
