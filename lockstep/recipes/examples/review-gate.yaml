version: "1.0"
name: review-gate
description: >
  The CHILD recipe feature-dev-reviewed.yaml's fractal
  subcall spawns (scenario: review-gate). One review step whose artifact
  path (.lockstep/review.md) is covered by baseline_globs, so the parent's
  `hash_from: _subcall_envelope.artifact_hashes.review` resolves against
  this child run's own validated baseline snapshot — never against
  collect-time project bytes the worker could have edited. The reviewed
  sources (src/**) are pinned too: the parent's PreToolUse gate is
  unlocked while this subcall runs, so the worker can edit src/** while
  the reviewer reads it — the `unchanged src/** since start` check makes
  that edit fail this run's own step, and the loop cap of 1 escalates the
  failure to a human instead of looping (the reviewer cannot restore
  bytes it is forbidden to touch). Reviewing more than src/**? Add every
  reviewed glob to BOTH baseline_globs and the `unchanged` check — here
  and in the parent's verify step. The verdict regex stays two-valued
  (this step validates that a verdict was STATED; the parent's gate is
  what requires PASS). This run is a full lockstep run in its own right:
  it goes through every v1 profile rule and gate on its own,
  independently of the parent. Copied from
  tests/fixtures/recipes/good/child-review.yaml (the ground-truth shape),
  with fuller task text. Repo-level example only — copy alongside
  feature-dev-reviewed.yaml into <project>/.lockstep/recipes/.

baseline_globs: [".lockstep/**", "src/**"]

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_review:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: review
      task: "Write the review to .lockstep/review.md; end with Verdict: PASS or FAIL"
      exit_criterion: "review.md exists and states a verdict"
      evidence_schema:
        required: [review_path]
        properties:
          review_path:
            type: string
            format: project-path
      checks:
        - type: file_matches
          path_from: review_path
          regex: "(?m)^\\s*Verdict:\\s*(PASS|FAIL)\\s*$"
        # the source pin: a worker edit landing while this review runs
        # fails the review itself — clean-code-reviewed, dirty-code-shipped
        # is closed at the child's own gate first.
        - type: unchanged
          glob: "src/**"
          since: start

  validate_review:
    type: python
    tool: run_checks

  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: escalate

edges:
  - {from: START, to: step_review}
  - {from: step_review, to: validate_review}
  - {from: validate_review, to: END, condition: "verdict_status == 'pass'"}
  - {from: validate_review, to: step_review, condition: "verdict_status == 'fail'"}
  - {from: escalate_gate, to: escalate}

# cap 1: a failed review attempt (e.g. the source pin tripped) escalates to
# a human on the next attempt instead of looping — a legitimate FAIL verdict
# is a PASSING format check and completes normally, so it never meets this cap.
loop_limits: {validate_review: 1}
loop_exits:  {validate_review: escalate_gate}
