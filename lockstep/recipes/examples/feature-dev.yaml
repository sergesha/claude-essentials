version: "1.0"
name: lockstep-feature-dev
description: >
  Task-8 example recipe — plan -> implement -> test -> review, each step an
  interrupt/python-validator triple in the spike-frozen dialect (mirrors
  tests/fixtures/recipes/good/two-steps.yaml exactly: same passthrough-gated
  escalate, same idempotent: false, same loop_limits/loop_exits keyed on the
  validator). Repo-level example only (v1 has no builtin recipe resolution)
  — copy into <project>/.lockstep/recipes/ to use.

  DESIGN ASSUMPTION: tests are HUMAN-OWNED in this flow. The agent may
  create/modify src/ and .lockstep/ but never tests/ or the runner's config
  surface (conftest.py, pytest.ini, pyproject.toml) — the test step's
  `unchanged {since: start}` checks enforce this from run-start onward, so
  no earlier step can pre-bless a later change before the freeze applies. A
  flow where the agent is meant to author tests needs its own recipe with a
  dedicated test-authoring step (`changed_in {paths: [tests/]}`) and the
  freeze moved after it.

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

# Runner CONFIG surface is fenced too (decision 14) — the checks below read
# it (test step's unchanged set, review step's diff_only), globs alone gate
# nothing on their own.
baseline_globs:
  - tests/**
  - src/**
  - .lockstep/**
  - conftest.py
  - pytest.ini
  - pyproject.toml

nodes:
  plan_step:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: plan
      task: "Write an implementation plan and save it as a project-relative markdown file."
      exit_criterion: "The plan file exists, is fresh since run start, and has the required sections."
      evidence_schema:
        required: [plan_path]
        properties:
          plan_path:
            type: string
            format: project-path
      checks:
        - type: md_has_sections
          path_from: plan_path
          sections: [Approach, Steps]
        - type: fresh
          path_from: plan_path

  validate_plan:
    type: python
    tool: run_checks

  implement_step:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: implement
      task: "Implement the feature per the plan. Touch only src/ and .lockstep/ — tests/ and the runner's config stay untouched."
      exit_criterion: "src/ changed since run start, and nothing changed outside src/ and .lockstep/ since run start."
      evidence_schema:
        required: [summary]
        properties:
          summary:
            type: string
      checks:
        - type: changed_in
          paths: [src/]
        - type: diff_only
          paths: [src/, .lockstep/]

  validate_implement:
    type: python
    tool: run_checks

  test_step:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: test
      task: "Run the test suite: `pytest -q`."
      exit_criterion: "The suite passes with at least one test and no skips; tests/ and the runner's config surface are unchanged since run start."
      evidence_schema:
        required: [summary]
        properties:
          summary:
            type: string
      checks:
        - type: junit_gate
          command: "pytest -q"
          min_tests: 1
          max_skipped: 0
        - type: unchanged
          glob: "tests/**"
          since: start
        - type: unchanged
          glob: "conftest.py"
          since: start
        - type: unchanged
          glob: "pytest.ini"
          since: start
        - type: unchanged
          glob: "pyproject.toml"
          since: start

  validate_test:
    type: python
    tool: run_checks

  review_step:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: review
      task: "Write a code review of the change and save it as a project-relative markdown file ending with a line 'Verdict: PASS'."
      exit_criterion: "The review file exists, is fresh, matches the verdict regex, and only .lockstep/ changed since the test step."
      evidence_schema:
        required: [review_path]
        properties:
          review_path:
            type: string
            format: project-path
      checks:
        - type: md_has_sections
          path_from: review_path
          sections: [Verdict]
        - type: file_matches
          path_from: review_path
          regex: "Verdict:\\s*PASS"
        - type: fresh
          path_from: review_path
        - type: diff_only
          paths: [.lockstep/]

  validate_review:
    type: python
    tool: run_checks

  # NOTE: see two-steps.yaml / minimal.yaml — loop_exits routes through a
  # plain passthrough gate, never straight to the `escalate` interrupt
  # (yamlgraph skips the interrupt's prepare_fn on a loop_exits redirect,
  # spike finding 3). All four validators share this one gate.
  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: plan_step
  - from: plan_step
    to: validate_plan
  - from: validate_plan
    to: implement_step
    condition: "verdict_status == 'pass'"
  - from: validate_plan
    to: plan_step
    condition: "verdict_status == 'fail'"
  - from: implement_step
    to: validate_implement
  - from: validate_implement
    to: test_step
    condition: "verdict_status == 'pass'"
  - from: validate_implement
    to: implement_step
    condition: "verdict_status == 'fail'"
  - from: test_step
    to: validate_test
  - from: validate_test
    to: review_step
    condition: "verdict_status == 'pass'"
  - from: validate_test
    to: test_step
    condition: "verdict_status == 'fail'"
  - from: review_step
    to: validate_review
  - from: validate_review
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_review
    to: review_step
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

# loop_limits/loop_exits key on the REPEATING node (the python validator),
# never the interrupt (spike finding 2). All four steps share the one
# escalate gate (spike finding 3).
loop_limits:
  validate_plan: 2
  validate_implement: 2
  validate_test: 2
  validate_review: 2
loop_exits:
  validate_plan: escalate_gate
  validate_implement: escalate_gate
  validate_test: escalate_gate
  validate_review: escalate_gate
