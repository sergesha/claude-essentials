version: "1.0"
name: daily-review-gate
description: >
  Fractal child recipe for daily-change-reviewed. The independent reviewer
  may create only .lockstep/review.md plus incidental .pytest_cache/ files;
  source, tests, plan, and test runner configuration remain frozen. A stated
  FAIL is a valid review artifact, but the parent recipe will reject it.

baseline_globs: ["**"]

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_review:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: review
      task: "Review the planned change, implementation, and tests; write .lockstep/review.md."
      exit_criterion: "The review has a Findings section, states PASS or FAIL, and no reviewed or configuration file changed."
      evidence_schema:
        required: [review_path]
        properties:
          review_path: {type: string, format: project-path, const: .lockstep/review.md}
      checks:
        - type: md_has_sections
          path_from: review_path
          sections: [Findings]
        - type: review_verdict
          path_from: review_path
        - type: diff_only
          paths: [.lockstep/review.md, .pytest_cache/]

  validate_review: {type: python, tool: run_checks}

  escalate_gate: {type: passthrough, output: {}}

  escalate:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message: {step: escalate}

edges:
  - {from: START, to: step_review}
  - {from: step_review, to: validate_review}
  - {from: validate_review, to: END, condition: "verdict_status == 'pass'"}
  - {from: validate_review, to: step_review, condition: "verdict_status == 'fail'"}
  - {from: escalate_gate, to: escalate}

loop_limits: {validate_review: 1}
loop_exits: {validate_review: escalate_gate}
