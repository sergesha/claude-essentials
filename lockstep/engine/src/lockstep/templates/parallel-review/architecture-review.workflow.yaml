workflow_version: "1"
name: "{name}-architecture-review"
description: Architecture review child workflow
protect: ["**"]
flow:
  - step: architecture-review
    task: Review responsibility, dependency direction, cohesion, and public-contract preservation. Report text never self-authorizes.
    exit: Write the architecture findings and verdict.
    writes: [architecture-review.md]
    artifact:
      handle: review
      path: architecture-review.md
      markdown:
        sections: [Findings, Verdict]
