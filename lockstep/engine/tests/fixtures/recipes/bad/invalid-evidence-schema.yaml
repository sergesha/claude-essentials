version: "1.0"
name: invalid-evidence-schema
description: >
  `required` must be an array of strings; as a string it is not a valid
  Draft 2020-12 schema. Left unchecked here, the recipe validates ok and
  every scenario_done on this step raises SchemaError out of jsonschema.
state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list
tools:
  run_checks: {type: python, module: lockstep_mcp.validators, function: run_checks}
nodes:
  step_one:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: one
      task: "do the thing"
      exit_criterion: "it is done"
      evidence_schema:
        required: path
        properties: {path: {type: string, format: project-path}}
      checks: [{type: file_exists, path_from: path}]
  validate_one: {type: python, tool: run_checks}
  escalate_gate: {type: passthrough, output: {}}
  escalate:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message: {step: escalate}
edges:
  - {from: START, to: step_one}
  - {from: step_one, to: validate_one}
  - {from: validate_one, to: END, condition: "verdict_status == 'pass'"}
  - {from: validate_one, to: step_one, condition: "verdict_status == 'fail'"}
  - {from: escalate_gate, to: escalate}
loop_limits: {validate_one: 2}
loop_exits:  {validate_one: escalate_gate}
