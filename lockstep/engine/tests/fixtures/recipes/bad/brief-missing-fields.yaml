version: "1.0"
name: lockstep-bad-brief-missing-fields
description: >
  Bad fixture: step_one's brief drops exit_criterion. Expect:
  "exit_criterion".

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list
  task_name: str

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_one:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one
      task: "Do the {task_name} thing"
      # violation: exit_criterion dropped
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path

  validate_one:
    type: python
    tool: run_checks

  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: step_one
  - from: step_one
    to: validate_one
  - from: validate_one
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_one
    to: step_one
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

loop_limits:
  validate_one: 2
loop_exits:
  validate_one: escalate_gate
