version: "1.0"
name: lockstep-profile-duplicate-step
description: >
  Bad fixture — two work interrupts share the step name `one`.
  Engine._predict_spawn and done() key on the parked step name; a
  collision reads the wrong interrupt/validator, so the profile refuses it.

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_one:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one
      task: "Do the first thing"
      exit_criterion: "Step one is done"
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path

  validate_one:
    type: python
    tool: run_checks

  step_two:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one            # DUPLICATE of step_one's step name
      task: "Do the second thing"
      exit_criterion: "Step two is done"
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path

  validate_two:
    type: python
    tool: run_checks

  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: step_one
  - from: step_one
    to: validate_one
  - from: validate_one
    to: step_two
    condition: "verdict_status == 'pass'"
  - from: validate_one
    to: step_one
    condition: "verdict_status == 'fail'"
  - from: step_two
    to: validate_two
  - from: validate_two
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_two
    to: step_two
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

loop_limits:
  validate_one: 2
  validate_two: 2
loop_exits:
  validate_one: escalate_gate
  validate_two: escalate_gate
