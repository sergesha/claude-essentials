version: "1.0"
name: lockstep-server-mixed-checks
description: >
  Single step whose checks mix a SHAPE type (file_exists) and a COMMAND
  type (cmd_ok), for `scenario_dryrun`'s shape-only contract: dryrun must
  report the shape check's real verdict while
  reporting the cmd_ok check `skipped (dryrun)` without ever running its
  command. Dialect mirrors tests/fixtures/recipes/good/minimal.yaml.

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_one:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one
      task: "Do the thing"
      exit_criterion: "It is done"
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path
        - type: cmd_ok
          command: "touch DRYRUN-SENTINEL-SHOULD-NOT-EXIST"

  validate_one:
    type: python
    tool: run_checks

  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: step_one
  - from: step_one
    to: validate_one
  - from: validate_one
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_one
    to: step_one
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

loop_limits:
  validate_one: 2
loop_exits:
  validate_one: escalate_gate
