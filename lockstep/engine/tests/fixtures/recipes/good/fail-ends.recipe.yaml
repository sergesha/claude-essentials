version: "1.0"
name: fail-ends
description: >
  A recipe whose fail edge routes straight to END instead of looping back:
  the run is over the moment a step fails. `done()` must report that as a
  terminal, non-passing result — there is no next brief to hand back, and
  reading one would raise inside `scenario_done` while the index still
  said `awaiting`.
state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list
tools:
  run_checks: {type: python, module: lockstep.runtime.validators, function: run_checks}
nodes:
  step_one:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: one
      task: "do the thing"
      exit_criterion: "the artifact exists"
      evidence_schema:
        required: [path]
        properties: {path: {type: string, format: project-path}}
      checks: [{type: file_exists, path_from: path}]
  validate_one: {type: python, tool: run_checks}
edges:
  - {from: START, to: step_one}
  - {from: step_one, to: validate_one}
  - {from: validate_one, to: END, condition: "verdict_status == 'pass'"}
  - {from: validate_one, to: END, condition: "verdict_status == 'fail'"}
