version: "1.0"
name: subcall-fractal
description: >
  Task-7 fixture — one work step, then a FRACTAL review subcall (scenario:
  child-review, artifacts pinned) whose done edge lands on a verify step
  that hash-pins the child's artifact. validate_verify's loop limit of 2
  is LOAD-BEARING (I10.3): the integration tamper burns execution 1, the
  restore-pass is execution 2.
baseline_globs: [".lockstep/**"]
state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list
  _subcall_status: str
  _subcall_envelope: dict
tools:
  run_checks:    {type: python, module: lockstep_mcp.validators, function: run_checks}
  subcall_spawn: {type: python, module: lockstep_mcp.subcalls, function: spawn}
  subcall_poll:  {type: python, module: lockstep_mcp.subcalls, function: poll}
nodes:
  step_plan:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: plan
      task: "write the plan"
      exit_criterion: "plan file exists"
      evidence_schema:
        required: [plan_path]
        properties: {plan_path: {type: string, format: project-path}}
      checks: [{type: file_exists, path_from: plan_path}]
  validate_plan: {type: python, tool: run_checks}
  review_spawn:  {type: python, tool: subcall_spawn}
  review_wait:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: _subcall
      node: review
      runner: claude
      timeout_minutes: 30
      prompt: "Review the plan in .lockstep/plan.md and print a one-line verdict."
      scenario: child-review
      artifacts: {review: ".lockstep/review.md"}
  review_poll: {type: python, tool: subcall_poll}
  escalate_gate: {type: passthrough, output: {}}
  escalate:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message: {step: escalate}
  step_verify:
    type: interrupt
    idempotent: false
    state_key: brief
    resume_key: evidence
    message:
      step: verify
      task: "confirm the reviewer's artifact is untouched and its verdict is PASS"
      exit_criterion: "review.md matches the hash pinned by the child run AND states Verdict: PASS"
      evidence_schema:
        required: [review_path]
        properties: {review_path: {type: string, format: project-path}}
      checks:
        # the pin proves provenance (bytes unchanged since the child's last
        # PASS); the regex proves the VERDICT — a child that writes
        # 'Verdict: FAIL' must never walk the parent to done (C1).
        - type: file_matches_hash
          path_from: review_path
          hash_from: _subcall_envelope.artifact_hashes.review
        - type: file_matches
          path_from: review_path
          regex: "Verdict:\\s*PASS"
  validate_verify: {type: python, tool: run_checks}
edges:
  - {from: START, to: step_plan}
  - {from: step_plan, to: validate_plan}
  - {from: validate_plan, to: review_spawn, condition: "verdict_status == 'pass'"}
  - {from: validate_plan, to: step_plan, condition: "verdict_status == 'fail'"}
  - {from: review_spawn, to: review_wait}
  - {from: review_wait, to: review_poll}
  - {from: review_poll, to: review_wait, condition: "_subcall_status == 'running'"}
  - {from: review_poll, to: step_verify, condition: "_subcall_status == 'done'"}
  - {from: review_poll, to: escalate_gate, condition: "_subcall_status == 'error'"}
  - {from: escalate_gate, to: escalate}
  - {from: step_verify, to: validate_verify}
  - {from: validate_verify, to: END, condition: "verdict_status == 'pass'"}
  - {from: validate_verify, to: step_verify, condition: "verdict_status == 'fail'"}
loop_limits: {validate_plan: 2, validate_verify: 2}
loop_exits:  {validate_plan: escalate_gate, validate_verify: escalate_gate}
