version: "1.0"
name: lockstep-engine-error-check
description: >
  Task-5 fixture — single step whose check is a `cmd_ok` pointed at a
  nonexistent binary, so `run_checks` RAISES on every attempt (decision 16:
  a raising check yields verdict `error`, not `fail` — never resumes,
  never consumes the loop budget). Dialect mirrors
  tests/fixtures/recipes/good/two-steps.yaml exactly.

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_one:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one
      task: "Do the thing"
      exit_criterion: "It is done"
      evidence_schema:
        required: [note]
        properties:
          note:
            type: string
      checks:
        - type: cmd_ok
          command: "this-binary-does-not-exist-lockstep-xyz"

  validate_one:
    type: python
    tool: run_checks

  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: step_one
  - from: step_one
    to: validate_one
  - from: validate_one
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_one
    to: step_one
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

loop_limits:
  validate_one: 2
loop_exits:
  validate_one: escalate_gate
