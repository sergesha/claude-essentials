version: "1.0"
name: lockstep-spike-minimal
description: >
  Task-1 spike fixture — one work step (interrupt -> python validator),
  a pass/fail conditional loop back to the same step, a loop-limit escalate
  exit. Dialect frozen here per yamlgraph 0.5.18; see yamlgraph_api.py
  module docstring for every deviation from the plan's assumed shape.

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list
  task_name: str

tools:
  run_checks:
    type: python
    module: lockstep_mcp.validators
    function: run_checks

nodes:
  step_one:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one
      task: "Do the {task_name} thing"
      exit_criterion: "It is done"
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path

  validate_one:
    type: python
    tool: run_checks

  # NOTE (deviation, see yamlgraph_api.py docstring): loop_exits routes
  # to this plain passthrough, never straight to the `escalate` interrupt.
  # yamlgraph's loop_exit routing (make_expr_router_fn / expr_router_fn)
  # bypasses the interrupt-node `_prepare` redirect that normal authored
  # edges get in `_process_edge` — a direct `loop_exits: {validate_one:
  # escalate}` fires `escalate`'s interrupt_fn WITHOUT re-running its
  # prepare_fn, so it interrupts with the STALE state["brief"] left over
  # from step_one instead of the {step: escalate} marker. Routing the
  # loop_exit through this ordinary node first means the FOLLOWING edge
  # (escalate_gate -> escalate, an authored edge) gets the normal redirect
  # to escalate_prepare, which is what actually commits the marker.
  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: step_one
  - from: step_one
    to: validate_one
  - from: validate_one
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_one
    to: step_one
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

# NOTE (deviation, see yamlgraph_api.py docstring): loop_limits/loop_exits key
# on the REPEATING node (the python validator), never the interrupt — interrupt
# nodes don't consult loop_limit at all. Value 2 (not the plan's literal 3):
# check_loop_limit fires BEFORE the count-th execution runs (count >= limit),
# so limit=2 allows 2 real validate_one executions and blocks the 3rd —
# matching "3 consecutive fail-resumes trigger escalate" in the spike tests.
loop_limits:
  validate_one: 2
loop_exits:
  validate_one: escalate_gate
