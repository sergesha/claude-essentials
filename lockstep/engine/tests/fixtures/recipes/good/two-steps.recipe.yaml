version: "1.0"
name: two-steps
description: >
  Two chained step triples (interrupt -> python validator),
  each with its own pass/fail loop back to itself and a loop-limit escalate
  exit routed through a shared passthrough gate. Dialect mirrors
  tests/fixtures/recipes/good/minimal.recipe.yaml exactly (yamlgraph 0.5.18,
  frozen in yamlgraph_api.py).

state:
  brief: dict
  evidence: dict
  verdict_status: str
  verdict_reasons: list
  task_name: str

tools:
  run_checks:
    type: python
    module: lockstep.runtime.validators
    function: run_checks

nodes:
  step_one:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: one
      task: "Do the first thing"
      exit_criterion: "Step one is done"
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path

  validate_one:
    type: python
    tool: run_checks

  step_two:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: two
      task: "Do the second thing"
      exit_criterion: "Step two is done"
      evidence_schema:
        required: [path]
        properties:
          path:
            type: string
            format: project-path
      checks:
        - type: file_exists
          path_from: path

  validate_two:
    type: python
    tool: run_checks

  # NOTE: see minimal.recipe.yaml for why loop_exits routes through a plain
  # passthrough gate instead of straight to the `escalate` interrupt
  # (yamlgraph skips the interrupt's prepare_fn on a loop_exits
  # redirect). Both step triples share this one gate.
  escalate_gate:
    type: passthrough
    output: {}

  escalate:
    type: interrupt
    state_key: brief
    resume_key: evidence
    idempotent: false
    message:
      step: escalate

edges:
  - from: START
    to: step_one
  - from: step_one
    to: validate_one
  - from: validate_one
    to: step_two
    condition: "verdict_status == 'pass'"
  - from: validate_one
    to: step_one
    condition: "verdict_status == 'fail'"
  - from: step_two
    to: validate_two
  - from: validate_two
    to: END
    condition: "verdict_status == 'pass'"
  - from: validate_two
    to: step_two
    condition: "verdict_status == 'fail'"
  - from: escalate_gate
    to: escalate

# loop_limits/loop_exits key on the REPEATING node (the python validator),
# never the interrupt — see minimal.recipe.yaml / yamlgraph_api.py for the full
# rationale.
loop_limits:
  validate_one: 2
  validate_two: 2
loop_exits:
  validate_one: escalate_gate
  validate_two: escalate_gate
