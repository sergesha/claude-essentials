version: "1.0"
name: native-child-then-parent-interrupt
state:
  phase: str
  answer: str
  parent_answer: str
nodes:
  child:
    type: subgraph
    graph: child_interrupt.recipe.yaml
    mode: direct
  parent_ask:
    type: interrupt
    message: Parent?
    state_key: parent_question
    resume_key: parent_answer
    idempotent: false
edges:
  - {from: START, to: child}
  - {from: child, to: parent_ask}
  - {from: parent_ask, to: END}
