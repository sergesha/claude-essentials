version: "1.0"
name: native-parent-then-direct
state:
  parent_answer: str
  phase: str
  answer: str
nodes:
  parent_ask:
    type: interrupt
    message: Parent?
    state_key: parent_question
    resume_key: parent_answer
    idempotent: false
  child:
    type: subgraph
    graph: child_interrupt.recipe.yaml
    mode: direct
edges:
  - {from: START, to: parent_ask}
  - {from: parent_ask, to: child}
  - {from: child, to: END}
