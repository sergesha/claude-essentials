version: "1.0"
name: native-wrapped-child
state:
  seed: str
  seen: str
  observed_thread_id: str
  observed_checkpoint_ns: str
  observed_checkpoint_id: str
  answer: dict
  phase: str
tools:
  persist_identity:
    type: python
    path: native_tools.py
    function: persist_identity
nodes:
  ask:
    type: interrupt
    message: Wrapped answer?
    state_key: question
    resume_key: answer
    idempotent: false
  finish:
    type: python
    tool: persist_identity
edges:
  - {from: START, to: ask}
  - {from: ask, to: finish}
  - {from: finish, to: END}
