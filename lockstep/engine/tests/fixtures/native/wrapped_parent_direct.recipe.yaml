version: "1.0"
name: native-wrapped-parent
state:
  seed: str
  seen: str
  observed_thread_id: str
  observed_checkpoint_ns: str
  observed_checkpoint_id: str
  answer: dict
  phase: str
nodes:
  child:
    type: subgraph
    graph: wrapped_child.recipe.yaml
    mode: direct
  done:
    type: passthrough
edges:
  - {from: START, to: child}
  - {from: child, to: done}
  - {from: done, to: END}
