version: "1.0"
name: native-child-interrupt
state:
  phase: str
  question: dict
  answer: dict
nodes:
  prepare:
    type: passthrough
    output: {phase: waiting}
  ask:
    type: interrupt
    message:
      step: answer
      task: Answer the child question.
      exit_criterion: An answer is supplied.
      evidence_schema: {type: object}
      artifact_contract: []
      lockstep_effect:
        schema: lockstep.effect/v1
        kind: manual
        logical_id: answer
        runner: null
        inputs: {}
        writes: []
        artifacts: []
        deadline_seconds: null
        scope_state_keys: []
        result_schema: lockstep.effect-result/v1
    state_key: question
    resume_key: answer
    idempotent: false
  finish:
    type: passthrough
    output: {phase: complete}
edges:
  - {from: START, to: prepare}
  - {from: prepare, to: ask}
  - {from: ask, to: finish}
  - {from: finish, to: END}
