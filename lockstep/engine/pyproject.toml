[project]
name = "lockstep"
version = "0.1.0"
description = "Flow-enforcement engine for coding agents: declarative yamlgraph recipes, durable runs, deterministic evidence gates"
requires-python = ">=3.11"
dependencies = [
  "yamlgraph==0.5.22",
  "langgraph==1.2.10",
  "mcp>=2.0,<3",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
lockstep = "lockstep.bootstrap:main"
lockstep-dependency-install = "lockstep.dependency_patch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[dependency-groups]
dev = [
  "opentelemetry-sdk==1.44.0",
  "pytest>=8",
  "ruff>=0.16.5",
]
