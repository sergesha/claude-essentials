[project]
name = "lockstep"
version = "0.1.0"
description = "Flow-enforcement engine for coding agents: declarative yamlgraph recipes, durable runs, deterministic evidence gates"
requires-python = ">=3.11"
dependencies = [
  "yamlgraph==0.5.18",
  "langgraph==1.2.10",
  "mcp>=2.0,<3",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.scripts]
lockstep = "lockstep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[dependency-groups]
dev = ["pytest>=8"]
