[project]
name = "lockstep"
version = "0.1.0"
description = "Flow-enforcement engine for coding agents: declarative yamlgraph recipes, durable runs, deterministic evidence gates"
requires-python = ">=3.11"
dependencies = [
  "yamlgraph==0.5.22",
  "langgraph==1.2.10",
  "mcp>=2.0,<3",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
lockstep = "lockstep.bootstrap:main"
lockstep-dependency-install = "lockstep.dependency_patch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "opentelemetry-sdk==1.44.0",
  "pytest>=8",
  "ruff>=0.16.5",
]

[tool.mypy]
files = [
  "src/lockstep/runtime/_publication_queries.py",
  "src/lockstep/runtime/_publication_values.py",
  "src/lockstep/runtime/_recovery_watch_drive.py",
  "src/lockstep/runtime/_recovery_watch_settlement.py",
  "src/lockstep/runtime/engine_drive_service.py",
  "src/lockstep/runtime/publication.py",
  "src/lockstep/runtime/effects/_coordinator_authority_recovery.py",
  "src/lockstep/runtime/effects/_coordinator_foundation.py",
  "src/lockstep/runtime/effects/_coordinator_orchestration.py",
  "src/lockstep/runtime/effects/_coordinator_publication_existing.py",
  "src/lockstep/runtime/effects/_coordinator_publication_planning.py",
  "src/lockstep/runtime/effects/_coordinator_publication_preparation.py",
  "src/lockstep/runtime/effects/_coordinator_publication_recovery.py",
  "src/lockstep/runtime/effects/_coordinator_publication_recovery_transaction.py",
  "src/lockstep/runtime/effects/_coordinator_publication_transition.py",
  "src/lockstep/runtime/effects/_coordinator_reconciliation.py",
  "src/lockstep/runtime/effects/_coordinator_runner.py",
  "src/lockstep/runtime/effects/_coordinator_values.py",
  "src/lockstep/runtime/effects/_ledger_records.py",
  "src/lockstep/runtime/effects/_ledger_policy.py",
  "src/lockstep/runtime/effects/_ledger_queries.py",
  "src/lockstep/runtime/effects/ledger.py",
  "src/lockstep/runtime/read_resources.py",
  "tests/typing/effect_phase_contract.py",
]
mypy_path = "src"
python_version = "3.11"
show_error_codes = true
strict_equality = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "lockstep.runtime.effects._coordinator_authority_recovery",
  "lockstep.runtime.effects._coordinator_foundation",
  "lockstep.runtime.effects._coordinator_orchestration",
  "lockstep.runtime.effects._coordinator_publication_existing",
  "lockstep.runtime.effects._coordinator_publication_planning",
  "lockstep.runtime.effects._coordinator_publication_preparation",
  "lockstep.runtime.effects._coordinator_publication_recovery",
  "lockstep.runtime.effects._coordinator_publication_recovery_transaction",
  "lockstep.runtime.effects._coordinator_publication_transition",
  "lockstep.runtime.effects._coordinator_reconciliation",
  "lockstep.runtime.effects._coordinator_runner",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "lockstep.runtime._publication_queries"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
  "lockstep.runtime._recovery_watch_drive",
  "lockstep.runtime._recovery_watch_settlement",
  "lockstep.runtime.engine_drive_service",
]
disable_error_code = ["attr-defined"]
