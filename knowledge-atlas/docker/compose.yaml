services:
  atlas:
    image: ghcr.io/sergesha/knowledge-atlas:0.4.0${ATLAS_IMAGE_DIGEST:+@${ATLAS_IMAGE_DIGEST}}
    platform: linux/arm64
    init: true
    environment:
      KNOWLEDGE_ATLAS_CONFIG: /data/service-config.json
      KNOWLEDGE_ATLAS_GRAPH_KEY_FILE: /data/graph/admin.key
    volumes:
      - runtime:/runtime
      - data:/data
      - auth:/auth
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /opt/knowledge-atlas/.venv/bin/python, -m, knowledge_atlas.cli, status]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
volumes:
  runtime:
    name: ${ATLAS_RUNTIME_VOLUME:-${COMPOSE_PROJECT_NAME}_runtime}
  data:
  auth:
